<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/coffee-cup.svg">
    <link rel="stylesheet" href="sass/style.css" />
    <title>Menu</title>
  </head>
  <body>
    <header class="header">
      <div class="wrapper">
        <div class="flex-container">
          <a href="./index.html" class="logo"></a>
          <nav class="nav">
            <ul class="flex-container">
              <li><a class="action" href="./Home.html#favorite">Favorite coffee</a></li>
              <li><a class="action" href="./Home.html#about">About</a></li>
              <li><a class="action" href="./Home.html#app">Mobile app</a></li>
              <li><a class="action" href="#contacts">Contact us</a></li>
            </ul>
          </nav>
          <a class="button_menu action button_menu_inactive">
            Menu
            <div class="button_menu__icon"></div>
          </a>
          <button class="button button_burger">
            <span class="button_burger__line line_1"></span
            ><span class="button_burger__line line_2"></span>
          </button>
        </div>
      </div>
    </header>
    <main>
      <section class="menu">
        <div class="wrapper menu-wrapper">
          <h2>
            Behind each of our cups hides an
            <i class="accent">amazing surprise</i>
          </h2>
          <div class="menu__categories">
            <button
              class="button button_category action button_category_active"
            >
              <div class="button_category__icon button_category__icon_1"></div>
              Coffee</button
            ><button class="button button_category action">
              <div class="button_category__icon button_category__icon_2"></div>
              Tea</button
            ><button class="button button_category action">
              <div class="button_category__icon button_category__icon_3"></div>
              Dessert
            </button>
          </div>
          <div class="menu__items"></div>
        </div>
      </section>
    </main>
    <footer>
      <section class="contacts" id="contacts">
        <div class="wrapper">
          <div class="contacts-background flex-container">
            <div class="socials">
              <h2 class="light">
                Sip, Savor, Smile. <i class="accent">It’s coffee time!</i>
              </h2>
              <div class="flex-container socials__buttons">
                <a
                  href="https://x.com/"
                  class="button button_social icon_x"
                  target="_blank"
                ></a
                ><a
                  href="https://www.instagram.com/"
                  class="button button_social icon_inst"
                  target="_blank"
                ></a
                ><a
                  href="https://www.facebook.com"
                  class="button button_social icon_fb"
                  target="_blank"
                ></a>
              </div>
            </div>
            <div class="cta">
              <h3 class="light">Contact us</h3>
              <a
                href="https://www.google.com/maps/place/%D0%94%D0%BE%D0%BD%D0%B0/@41.7767485,42.3835043,9.12z/data=!4m6!3m5!1s0x4067875e4697da81:0xd4472ceb6b0fbe8b!8m2!3d41.6450015!4d41.6292529!16s%2Fg%2F11hdyflqpf?entry=ttu&g_ep=EgoyMDI1MTAwOC4wIKXMDSoASAFQAw%3D%3D"
                class="action light"
                target="_blank"
              >
                <div class="cta__icon icon_pin"></div>
                8558 Green Rd., LA
              </a>
              <a href="tel:+1(603)555-0123" class="tel action light">
                <div class="cta__icon icon_phone"></div>
                +1 (603) 555-0123
              </a>
              <a class="action light">
                <div class="cta__icon icon_clock"></div>
                Mon-Sat: 9:00 AM – 23:00 PM
              </a>
            </div>
          </div>
        </div>
      </section>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
